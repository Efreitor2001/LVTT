name: lucifer-vtt
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: lucifer_vtt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password, app_db_password]
    volumes:
      - lucifer_pg:/var/lib/postgresql
      - ./deploy/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d lucifer_vtt]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: lucifer_vtt
      DATABASE_USER: lvt_app
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      PUBLIC_APP_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
      AUTH_SECURE_COOKIE: "true"
      TRUST_PROXY: "true"
    secrets: [app_db_password]
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
secrets:
  postgres_admin_password:
    file: ./secrets/postgres-admin.txt
  app_db_password:
    file: ./secrets/app-db.txt
volumes:
  lucifer_pg:
  caddy_data:
  caddy_config:
