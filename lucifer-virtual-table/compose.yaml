services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: lucifer_vtt
      POSTGRES_USER: lvt_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - lucifer_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U lvt_app -d lucifer_vtt"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://lvt_app:${POSTGRES_PASSWORD}@db:5432/lucifer_vtt
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:5173}
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:5173:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  lucifer_pg:
